[project]
name = "digits"
version = "0.1.0"
description = "Dimensionality reduction on handwritten digits"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "jupyterlab>=4.6.2",
    "numpy>=2.5.4",
    "torch>=2.14.1",
    "umap-learn>=0.5.12",
]

[build-system]
requires = ["uv_build>=0.12.0,<0.13"]
build-backend = "uv_build"

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]
